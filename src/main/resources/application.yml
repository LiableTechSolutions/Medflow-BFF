spring:
  application:
    name: medflow-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medflow}
    username: ${DB_USERNAME:medflow}
    password: ${DB_PASSWORD:medflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # Scans module-owned folders recursively: db/migration/<module>/V<n>__*.sql
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

medflow:
  security:
    jwt:
      # HS256 requires >= 32 bytes. Override in every non-local environment.
      secret: ${JWT_SECRET:medflow-local-dev-secret-change-me-0123456789}
      issuer: medflow-ai
      access-token-ttl: ${JWT_TTL:PT8H}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs.path: /api-docs

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

logging:
  pattern.level: "%5p [traceId=%X{traceId:-}]"
